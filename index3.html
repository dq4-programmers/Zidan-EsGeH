<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ular Klasik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #4CAF50;
        }

        .score-container {
            font-size: 1.2rem;
            margin-bottom: 15px;
            background: #2b2b2b;
            padding: 8px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        canvas {
            border: 4px solid #4CAF50;
            background-color: #111;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
        }

        /* Tombol Restart / Layar Game Over */
        .overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #4CAF50;
        }

        .overlay h2 {
            margin-bottom: 15px;
            color: #ff5252;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .game-wrapper {
            position: relative;
        }
    </style>
</head>
<body>

    <h1>SNAKE GAME</h1>
    <div class="score-container">
        Skor: <span id="score">0</span> | Skor Tertinggi: <span id="highScore">0</span>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="gameOverOverlay" class="overlay">
            <h2>GAME OVER</h2>
            <p id="finalScore" style="margin-bottom: 20px;">Skor Anda: 0</p>
            <button class="btn" onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <div class="instructions">
        Gunakan tombol <b>Panah (Arrow Keys)</b> atau <b>W, A, S, D</b> untuk mengontrol ular.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const grid = 20;
        let count = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;

        document.getElementById("highScore").innerText = highScore;

        // Ular
        let snake = [
            { x: 160, y: 160 },
            { x: 140, y: 160 },
            { x: 120, y: 160 },
            { x: 100, y: 160 }
        ];
        let dx = grid;
        let dy = 0;

        // Makanan
        let food = { x: 0, y: 0 };

        // Status Game
        let isGameOver = false;
        let changeDirectionCalled = false; // Mencegah dobel klik arah cepat

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function spawnFood() {
            food.x = getRandomInt(0, canvas.width / grid) * grid;
            food.y = getRandomInt(0, canvas.height / grid) * grid;

            // Pastikan makanan tidak muncul di tubuh ular
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        // Loop Game Utama
        function gameLoop() {
            if (isGameOver) return;

            requestAnimationFrame(gameLoop);

            // Mengontrol kecepatan game (menurunkan frame rate agar ular tidak terlalu cepat)
            if (++count < 6) {
                return;
            }
            count = 0;
            changeDirectionCalled = false;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gerakkan ular
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Cek tabrakan dengan dinding
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                triggerGameOver();
                return;
            }

            // Cek tabrakan dengan badan sendiri
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Cek jika ular memakan makanan
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    document.getElementById("highScore").innerText = highScore;
                }
                spawnFood();
            } else {
                snake.pop();
            }

            // Gambar Makanan
            ctx.fillStyle = "#ff5252";
            ctx.shadowColor = "#ff5252";
            ctx.shadowBlur = 10;
            ctx.fillRect(food.x, food.y, grid - 2, grid - 2);
            ctx.shadowBlur = 0; // Reset efek bayangan

            // Gambar Ular
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784";
                ctx.fillRect(part.x, part.y, grid - 2, grid - 2);
            });
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById("finalScore").innerText = "Skor Akhir: " + score;
            document.getElementById("gameOverOverlay").style.display = "block";
        }

        function resetGame() {
            snake = [
                { x: 160, y: 160 },
                { x: 140, y: 160 },
                { x: 120, y: 160 },
                { x: 100, y: 160 }
            ];
            dx = grid;
            dy = 0;
            score = 0;
            document.getElementById("score").innerText = score;
            isGameOver = false;
            document.getElementById("gameOverOverlay").style.display = "none";
            spawnFood();
            requestAnimationFrame(gameLoop);
        }

        // Kontrol Keyboard
        document.addEventListener("keydown", function(e) {
            if (changeDirectionCalled) return;

            // Mencegah layar ikut scroll saat menekan tombol panah
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                e.preventDefault();
            }

            const keyPressed = e.key;

            // Kiri
            if ((keyPressed === "ArrowLeft" || keyPressed === "a" || keyPressed === "A") && dx === 0) {
                dx = -grid;
                dy = 0;
                changeDirectionCalled = true;
            }
            // Atas
            if ((keyPressed === "ArrowUp" || keyPressed === "w" || keyPressed === "W") && dy === 0) {
                dx = 0;
                dy = -grid;
                changeDirectionCalled = true;
            }
            // Kanan
            if ((keyPressed === "ArrowRight" || keyPressed === "d" || keyPressed === "D") && dx === 0) {
                dx = grid;
                dy = 0;
                changeDirectionCalled = true;
            }
            // Bawah
            if ((keyPressed === "ArrowDown" || keyPressed === "s" || keyPressed === "S") && dy === 0) {
                dx = 0;
                dy = grid;
                changeDirectionCalled = true;
            }
        });

        // Mulai permainan pertama kali
        spawnFood();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
